services:

  # 1. Service Base de Données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ayyou_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ayyou_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ayyou_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ayyou_network

  # 2. Service Backend Django / Gunicorn
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayyou_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      USE_SQLITE_DEV: "False"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - ayyou_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s


  # 3. Service Frontend Angular 19 PWA (Nginx)
  frontend:
    build:
      context: ../Ayyou-frontend
      dockerfile: Dockerfile
    container_name: ayyou_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - ayyou_network


volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  ayyou_network:
    driver: bridge
